name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate tag matches app version
        shell: bash
        run: |
          app_version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          test "${GITHUB_REF_NAME}" = "v${app_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION_NAME=${app_version}" >&2
            exit 1
          }

      - name: Configure production signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/phonebridge-release.keystore"
          echo "PHONEBRIDGE_KEYSTORE_PATH=$RUNNER_TEMP/phonebridge-release.keystore" >> "$GITHUB_ENV"

      - name: Test and build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --stacktrace

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          apk="PhoneBridge-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$apk"
          cd dist
          sha256sum "$apk" > "$apk.sha256"

      - name: Upload release build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PhoneBridge-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/PhoneBridge-${GITHUB_REF_NAME}.apk
          dist/PhoneBridge-${GITHUB_REF_NAME}.apk.sha256
          --verify-tag
          --generate-notes
          --title "PhoneBridge ${GITHUB_REF_NAME}"

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/phonebridge-release.keystore"
